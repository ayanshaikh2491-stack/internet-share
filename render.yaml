services:
  - type: web
    name: internet-share-relay
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node src/server.js
    envVars:
      - key: PORT
        value: 3001
      - key: ROOM_TIMEOUT
        value: 1800000
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: internet-share-relay
          type: web
          property: host

  - type: static
    name: internet-share-client
    env: static
    region: oregon
    plan: free
    buildCommand: cd client && npm install && npm run build
    publishDir: client/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SERVER_URL
        fromService:
          name: internet-share-relay
          type: web
          property: host
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
